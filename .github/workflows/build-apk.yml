name: Build Minecraft Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p build-project

          unzip -q MinecraftBotAndroid-project.zip -d build-project

          echo "===== Extracted files ====="
          find build-project -maxdepth 3 -type f | head -100

          if [ -d "build-project/MinecraftBotAndroid" ]; then
            echo "Project found at build-project/MinecraftBotAndroid"
          elif [ -f "build-project/settings.gradle.kts" ]; then
            echo "Project found at build-project"
          else
            echo "ERROR: Android project not found!"
            exit 1
          fi

      - name: Select project directory
        shell: bash
        run: |
          if [ -f "build-project/MinecraftBotAndroid/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project/MinecraftBotAndroid" >> "$GITHUB_ENV"
          elif [ -f "build-project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

      - name: Install Gradle 9.6.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip

          unzip -q gradle-9.6.1-bin.zip

          echo "$PWD/gradle-9.6.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== Project ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== Building APK ====="
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK files ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-debug-APK
          path: |
            build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
