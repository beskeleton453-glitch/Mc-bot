name: Build Minecraft Bot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p build-project
          unzip -q MinecraftBotAndroid-project.zip -d build-project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          unzip -q gradle-9.6.1-bin.zip
          echo "$PWD/gradle-9.6.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd build-project/MinecraftBotAndroid
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-debug-APK
          path: build-project/MinecraftBotAndroid/app/build/outputs/apk/debug/*.apk
