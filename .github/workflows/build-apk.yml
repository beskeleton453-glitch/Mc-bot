name: Build Minecraft Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir build-project
          unzip -q MinecraftBotAndroid-project.zip -d build-project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build APK
        working-directory: build-project/MinecraftBotAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-debug-APK
          path: build-project/MinecraftBotAndroid/app/build/outputs/apk/debug/*.apk
