name: Build Minecraft Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          set -e
          mkdir -p build-project
          unzip -q MinecraftBotAndroid-project.zip -d build-project

      - name: Find project
        run: |
          if [ -f "build-project/MinecraftBotAndroid/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project/MinecraftBotAndroid" >> $GITHUB_ENV
          elif [ -f "build-project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project" >> $GITHUB_ENV
          else
            echo "ERROR: Cannot find Android project"
            find build-project -maxdepth 3 -type f
            exit 1
          fi

      - name: Remove external Kotlin plugin
        run: |
          set -e

          echo "Project: $PROJECT_DIR"

          # Remove Kotlin plugin declarations
          find "$PROJECT_DIR" \
            -name "*.gradle.kts" \
            -type f \
            -exec sed -i \
            '/org\.jetbrains\.kotlin\.android/d' {} \;

          find "$PROJECT_DIR" \
            -name "*.gradle" \
            -type f \
            -exec sed -i \
            '/org\.jetbrains\.kotlin\.android/d' {} \;

          echo "===== Remaining Kotlin references ====="
          grep -R "kotlin" "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          unzip -q gradle-9.6.1-bin.zip
          echo "$PWD/gradle-9.6.1/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build Debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          echo "===== APK ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-debug-APK
          path: |
            build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error          if [ -d "build-project/MinecraftBotAndroid" ]; then
            echo "Project found at build-project/MinecraftBotAndroid"
          elif [ -f "build-project/settings.gradle.kts" ]; then
            echo "Project found at build-project"
          else
            echo "ERROR: Android project not found!"
            exit 1
          fi

      - name: Select project directory
        shell: bash
        run: |
          if [ -f "build-project/MinecraftBotAndroid/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project/MinecraftBotAndroid" >> "$GITHUB_ENV"
          elif [ -f "build-project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build-project" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

      - name: Install Gradle 9.6.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip

          unzip -q gradle-9.6.1-bin.zip

          echo "$PWD/gradle-9.6.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== Project ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== Building APK ====="
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK files ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-debug-APK
          path: |
            build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
