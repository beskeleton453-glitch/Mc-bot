name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q MinecraftBotAndroid-project.zip -d project

      - name: Fix Gradle
        run: |
          cd project/MinecraftBotAndroid
          sed -i 's/9.4.0/8.7.3/g' build.gradle.kts
          sed -i 's/2.2.20/2.0.21/g' build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 35/g' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 35/g' app/build.gradle.kts

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd project/MinecraftBotAndroid
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBot-APK
          path: project/MinecraftBotAndroid/app/build/outputs/apk/debug/*.apk
